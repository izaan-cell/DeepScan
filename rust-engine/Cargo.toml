[package]
name = "deepscan-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deepscan-engine"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
anyhow = "1"

# gRPC
tonic = "0.12"
prost = "0.13"

# ONNX Runtime bindings — local CLIP / MiniLM / Jina-Code inference
ort = { version = "2.0.0-rc.4", features = ["download-binaries"] }
ndarray = "0.16"

# Embedded vector database
lancedb = "0.13"
arrow-array = "53"
arrow-schema = "53"

# File type routing / traversal
walkdir = "2"
ignore = "0.4"
infer = "0.16"        # magic-byte MIME sniffing
image = "0.25"        # raster decode for images
resvg = "0.44"        # SVG rasterization

# Audio/video
whisper-rs = "0.13"
ffmpeg-next = "7"

# OCR (pure Rust, no Python/Tesseract dependency)
ocrs = "0.9"

# Misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"
